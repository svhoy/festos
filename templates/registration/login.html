{% extends "base.html" %}

{% block title %}
Anmeldung – FESTOS
{% endblock %}

{% block content %}

<h1>Anmeldung</h1>

{% if form.errors %}
<p>
    Benutzername oder Passwort sind nicht korrekt.
</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    {% if next %}
    <input
            type="hidden"
            name="next"
            value="{{ next }}"
    >
    {% endif %}

    <button type="submit">
        Anmelden
    </button>
</form>

{% endblock %}
